    <line x1="186" y1="256" x2="314" y2="384"/><line x1="314" y1="256" x2="186" y2="384"/>
    <line x1="560" y1="230" x2="560" y2="410"/><line x1="470" y1="320" x2="650" y2="320"/>
    <line x1="496" y1="256" x2="624" y2="384"/><line x1="624" y1="256" x2="496" y2="384"/>
  </g>
  <!-- rama -->
  <g fill="none" stroke="#4426FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
